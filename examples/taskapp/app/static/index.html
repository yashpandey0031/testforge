<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>Task App</title>
<style>
 body{font-family:system-ui;max-width:560px;margin:2rem auto;padding:0 1rem}
 li{display:flex;gap:.5rem;align-items:center;padding:.3rem 0}
 .done .title{text-decoration:line-through;color:#888}
 #error{color:#b00020;min-height:1.2em}
</style>
</head>
<body>
<h1>Tasks</h1>
<form id="add-form">
  <input id="title" placeholder="What needs doing?" aria-label="Task title">
  <select id="priority" aria-label="Priority">
    <option value="low">low</option><option value="medium" selected>medium</option><option value="high">high</option>
  </select>
  <button id="add-btn" type="submit">Add</button>
</form>
<p id="error" role="alert"></p>
<ul id="task-list"></ul>
<p id="empty" hidden>No tasks yet.</p>
<script>
const $ = s => document.querySelector(s);
async function load(){
  const tasks = await (await fetch('/tasks')).json();
  $('#empty').hidden = tasks.length > 0;
  $('#task-list').innerHTML = '';
  for (const t of tasks){
    const li = document.createElement('li');
    li.dataset.id = t.id; li.className = t.done ? 'done' : '';
    li.innerHTML = `<input type="checkbox" class="toggle" ${t.done?'checked':''} aria-label="Complete">
      <span class="title"></span> <small class="prio"></small>
      <button class="delete">Delete</button>`;
    li.querySelector('.title').textContent = t.title;
    li.querySelector('.prio').textContent = '[' + t.priority + ']';
    li.querySelector('.toggle').onchange = async e => {
      await fetch('/tasks/'+t.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:e.target.checked})});
      load();
    };
    li.querySelector('.delete').onclick = async () => { await fetch('/tasks/'+t.id,{method:'DELETE'}); load(); };
    $('#task-list').appendChild(li);
  }
}
$('#add-form').onsubmit = async e => {
  e.preventDefault();
  $('#error').textContent = '';
  const r = await fetch('/tasks',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title:$('#title').value, priority:$('#priority').value})});
  if (!r.ok){ $('#error').textContent = 'Title is required (max 100 characters)'; return; }
  $('#title').value = ''; load();
};
load();
</script>
</body>
</html>
